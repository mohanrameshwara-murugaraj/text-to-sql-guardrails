[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "text-to-sql-guardrails"
version = "0.1.0"
description = "A conservative AST-based SQL safety starter"
requires-python = ">=3.11"
dependencies = [
    "sqlglot>=25,<30",
    "duckdb>=1.0,<2",
    "numpy>=1.26",
    "pandas>=2.2",
]
[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]
